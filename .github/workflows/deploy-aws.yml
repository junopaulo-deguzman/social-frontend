name: Deploy frontend to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: threadly-dev-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.FRONTEND_URL }}

      - name: Verify static output
        run: test -f dist/client/index.html

      - name: Inspect GitHub OIDC identity
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          url += separator + "audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization":
                      "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in (
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner_id",
              "ref",
          ):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Show configured AWS role
        run: echo "AWS role is ${{ vars.AWS_ROLE_ARN }}"

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: 456631682128

      - name: Upload frontend to S3
        run: |
          aws s3 sync dist/client/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --cache-control "public,max-age=300"

      - name: Refresh CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
